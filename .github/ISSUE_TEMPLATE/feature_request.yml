name: Suggest an improvement
description: Share a concrete idea for the workshop workflow or presentation.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the user and the problem they are trying to solve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behaviour
      description: Explain the proposed change and an example of how it would work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional references or examples. Do not include private information.
